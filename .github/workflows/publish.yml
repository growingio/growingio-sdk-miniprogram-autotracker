name: Publish And Release

on:
  push:
    tags:
      - 'CDP-v*'
      - 'Saas-v*'
      - 'v*'

jobs:
  publish:
    name: Auto Publish npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          # 不设置 registry-url，避免生成依赖 NODE_AUTH_TOKEN 的 .npmrc。
      - name: Enable npm Trusted Publishing
        # Trusted Publishing 要求 npm >= 11.5.1，Node 22 自带版本可能不足。
        run: |
          npm install --global npm@^11.5.1
          npm --version
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Build
        run: |
          rm -rf dist
          npm install
          npm run build
      - name: Publish to npm
        # 使用 GitHub Actions 的 OIDC 短期凭证，无需长期发布 Token。
        run: npm publish --registry=https://registry.npmjs.org/ --tag latest --access public --provenance

  release:
    name: Auto Create Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
